[project]
name = "llm-cost-optimizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.120.2",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "huggingface-hub>=1.26.0",
    "numpy>=2.5.1",
    "openai>=2.52.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "sqlmodel>=0.0.39",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "uvicorn>=0.52.1",
]
[project.scripts]
serve = "llm_cost_optimizer.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cost_optimizer"]

