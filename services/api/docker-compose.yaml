services:
  db:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: boubalkaly
      POSTGRES_DB: llm-cost-optimizer
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boubalkaly -d llm-cost-optimizer"]
      interval: 1s
      timeout: 10s
      retries: 10

  adminer:
    image: adminer
    restart: always
    ports:
     - 8081:8080

volumes:
  pgdata: