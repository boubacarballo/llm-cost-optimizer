[project]
name = "llm-cost-optimizer"
version = "0.1.0"
description = "API + arq worker for the LLM cost optimizer. One package, one image, two entrypoints."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.120.2",
    "arq>=0.28.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "openai>=2.52.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.1",
    # DB drivers: asyncpg for Postgres (prod), aiosqlite for local SQLite.
    "asyncpg>=0.30.0",
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
]

[project.scripts]
api = "llm_cost_optimizer.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cost_optimizer"]
