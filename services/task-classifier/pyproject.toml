[project]
name = "task-classifier"
version = "0.1.0"
description = "DeBERTa prompt-complexity classifier model server. Heavy ML deps, isolated image (GPU-friendly)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "huggingface-hub>=1.26.0",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "uvicorn>=0.52.1",
]

# torch defaults to the CUDA build on PyPI, which pulls cuda-toolkit plus ~15
# nvidia-* wheels (several GB) that the CPU-only slim image cannot use. Pin
# torch to the PyTorch CPU index instead. `explicit = true` keeps every other
# package resolving from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[project.scripts]
task-classifier = "task_classifier.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_classifier"]
