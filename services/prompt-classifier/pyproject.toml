[project]
name = "prompt-classifier"
version = "0.1.0"
description = "API for model tier classification"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.2",
    "torch>=2.13.0",
]
[project.scripts]
train = "prompt_classifier.train:main"
infer = "prompt_classifier.infer:main"
prompt-classifier = "prompt_classifier.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/prompt_classifier"]
