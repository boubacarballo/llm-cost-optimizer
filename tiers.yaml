      provider: openai
      pricing_per_million_tokens:
        input: 5.00
        output: 30.00
      reasoning_model: true      # six effort levels, plus Pro and Ultra (multi-agent) modes
      context_window: 1000000
      max_output_tokens: 128000
      best_for: "flagship agentic coding / complex reasoning; SOTA on Terminal-Bench 2.1 per OpenAI"

