tiers:
  tier_1:
    - id: gpt-5.6-luna
      provider: openai
      pricing_per_million_tokens:
        input: 1.00
        output: 6.00
      reasoning_model: true      # adjustable reasoning effort
      context_window: 1000000
      max_output_tokens: 128000
      best_for: "high-volume, low-latency tasks: classification, extraction, simple chat"

    - id: gpt-5.4-nano
      provider: openai
      pricing_per_million_tokens:
        input: 0.20
        output: 1.25
      reasoning_model: true
      context_window: 400000
      max_output_tokens: null
      best_for: "cheapest floor tier; routing, tagging, short-form completions"

    - id: gpt-5-nano
      provider: openai
      pricing_per_million_tokens:
        input: 0.05
        output: 0.40
      reasoning_model: true
      context_window: 400000
      max_output_tokens: null
      best_for: "legacy/cheapest option still live; same use cases as 5.4-nano at lower cost"

    - id: claude-haiku-4-5-20251001
      provider: anthropic
      pricing_per_million_tokens:
        input: 1.00
        output: 5.00
      reasoning_model: true      # hybrid model, extended thinking is toggle-able
      context_window: 1000000
      max_output_tokens: null
      best_for: "fast, cheap production workloads: classification, extraction, short summaries"

